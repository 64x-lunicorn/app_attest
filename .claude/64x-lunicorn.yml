setup_version: 3
forge: github
default_branch: main
research:
  path: research/
  tracked: true  # false = gitignored, local only
issues:
  tracker: forge
  path: null
ci:
  command: mix ci
  runtime: { stack: elixir, elixir: "1.20.4", otp: "29.1" }
  runner: null
  checks:
    - { name: Format, run: mix format --check-formatted, required: true }
    - { name: Unused deps, run: mix deps.unlock --check-unused, required: true }
    - { name: Compile, run: mix compile --warnings-as-errors, required: true }
    - { name: Test, run: mix test, required: true, secrets: [APPLE_DEVICECHECK_KEY, APPLE_DEVICECHECK_KEY_ID, APPLE_TEAM_ID] }
    - { name: Docs, run: mix docs --warnings-as-errors, required: true }
    - { name: Hex package, run: mix hex.build, required: true }
    - { name: Credo, run: mix credo --strict, required: true }
    - { name: Dialyzer, run: mix dialyzer, required: true }
    - { name: Hex audit, run: mix hex.audit, required: true }
    - { name: Dependency audit, run: mix deps.audit, required: true }
